<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini POS - Kasir Kantin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Mini POS Kantin</h1>
    <p>Kasir & keranjang belanja sederhana</p>
  </header>

  <main class="layout">
    <section class="card">
      <h2>Tambah Barang</h2>
      <form id="form-barang" novalidate>
        <label for="nama">Nama Barang</label>
        <input id="nama" type="text" placeholder="Contoh: Buku Tulis" autocomplete="off">
        <p class="error" id="err-nama"></p>

        <label for="harga">Harga Satuan (Rp)</label>
        <input id="harga" type="number" placeholder="Minimal 500" min="0">
        <p class="error" id="err-harga"></p>

        <label for="qty">Jumlah</label>
        <input id="qty" type="number" placeholder="Minimal 1" min="0">
        <p class="error" id="err-qty"></p>

        <button type="submit" class="btn primary">Tambah ke keranjang</button>
      </form>
    </section>

    <section class="card wide">
      <h2>Keranjang Belanja</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>No</th><th>Nama Barang</th><th class="num">Harga Satuan</th><th class="num">Qty</th><th class="num">Subtotal</th><th>Aksi</th></tr>
          </thead>
          <tbody id="tbody-keranjang"></tbody>
        </table>
      </div>
    </section>

    <section class="card wide">
      <h2>Pembayaran</h2>
      <div class="summary">
        <div><span>Total belanja</span><strong id="total">Rp 0</strong></div>
        <div><span>Diskon</span><strong id="diskon">Rp 0</strong></div>
        <div class="grand"><span>Total akhir</span><strong id="total-akhir">Rp 0</strong></div>
      </div>
      <p class="hint" id="info-diskon">Diskon 10% otomatis untuk belanja minimal Rp 50.000.</p>

      <div class="pay-grid">
        <div>
          <label for="kode">Kode promo (opsional)</label>
          <input id="kode" type="text" placeholder="HEMAT10" autocomplete="off">
        </div>
        <div>
          <label for="bayar">Uang bayar (Rp)</label>
          <input id="bayar" type="number" placeholder="Nominal diterima" min="0">
        </div>
      </div>
      <p id="kembalian" class="kembalian"></p>

      <button id="btn-reset" class="btn danger" type="button">Transaksi baru / reset</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
